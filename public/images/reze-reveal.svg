<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 768" width="512" height="768">
  <!--
    Reze — Reveal. Close profile, bomb-plug exposed, scanline overlay to
    read as "video" in the glitching Act III without shipping real frames.
    Red punch + jittered edge suggests the mask slipping.
  -->
  <defs>
    <linearGradient id="r2hair" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3757bd"/>
      <stop offset="1" stop-color="#0c1533"/>
    </linearGradient>
    <linearGradient id="r2skin" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f0d2bc"/>
      <stop offset="1" stop-color="#ad8872"/>
    </linearGradient>
    <linearGradient id="r2punch" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ff2c3a" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#ff2c3a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2c3a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1.3" fill="#000" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- face profile facing right, lit from right -->
  <path fill="url(#r2skin)" d="
    M140 400
    Q170 310 220 264
    Q258 226 300 230
    Q340 240 348 282
    Q360 340 340 386
    Q328 418 312 432
    Q336 450 340 472
    L340 560 L250 560 L200 520 Q168 480 152 440 Z"/>

  <!-- hair mass + sweep -->
  <path fill="url(#r2hair)" d="
    M140 400
    Q150 280 210 230
    Q280 188 342 232
    Q372 272 356 322
    Q340 344 316 340
    L270 320 Q236 324 220 350
    Q202 376 202 416
    Q198 452 212 480
    L220 520 Q200 520 184 506
    Q158 474 146 440 Z"/>

  <!-- bomb plug, exposed -->
  <g transform="translate(330 420)">
    <circle r="22" fill="#2a0b0c" stroke="#d8a876" stroke-width="4"/>
    <circle r="12" fill="#e0b680"/>
    <circle r="5" fill="#3c0f11"/>
    <path d="M-22 0 L22 0 M0 -22 L0 22" stroke="#822618" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- eye cast in shadow -->
  <path d="M262 314 Q282 302 302 314" stroke="#0b0716" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="282" cy="316" r="4" fill="#ff3540"/>

  <!-- mouth — subtle, almost neutral -->
  <path d="M230 392 Q246 398 262 390" stroke="#6a2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- scene provides its own red/heatwave; the SVG itself stays transparent
       outside the character so the portrait doesn't read as a rectangle -->
</svg>
